name: TrainAR Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build the documentation
  build:
    runs-on: ubuntu-latest # DocFX metadata now compiles the .cs sources directly, so no MSBuild/Windows toolchain is required
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        # with:
        #   submodules: true

      - name: Install DocFX
        # Run outside the repo root: it contains multiple Unity-generated .csproj files,
        # which makes the dotnet CLI fail with "contains more than one project file".
        run: dotnet tool install --global docfx
        working-directory: ${{ runner.temp }}

      - name: Use README.md as index.md
        run: cp README.md Documentation/index.md

      - name: Build
        run: docfx Documentation/docfx.json

      # Linux supports both URL spellings; generate the legacy alias only in CI.
      - name: Preserve the previous TrainAR Objects URL
        run: |
          test -f _site/manual/TrainARObjects.html
          cat > _site/manual/TrainArObjects.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>TrainAR Objects</title>
            <script>location.replace("TrainARObjects.html" + location.search + location.hash);</script>
            <meta http-equiv="refresh" content="0; url=TrainARObjects.html">
            <link rel="canonical" href="TrainARObjects.html">
          </head>
          <body><a href="TrainARObjects.html">Continue to TrainAR Objects</a></body>
          </html>
          HTML

      # Upload the generated documentation
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site # Must equals the 'build.dest' value on your docfx.json

  # Deploy the generated documentation to the gh-pages branch
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        # with:
        #   submodules: true

      # Download the generated documentation
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: _site
          path: _site

      # List downloaded files
      - name: List downloaded files
        run: ls -la _site

      # Deploy to github pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          verbose: true
